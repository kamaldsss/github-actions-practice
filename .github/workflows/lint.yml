# what is the gpal of your workflow.
# Goal whereever someone changes the code then lint check the code is correct or not they check syntex format indentation is correct or not. 




name: Auto Lint
on:
  push:
   paths:
    - "**/*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    # this step clone the code autonatically into the runner of the current branch 
      - name: checkout/Clone the code
        uses: actions/checkout@v4 # this are the part of giathub actions automatically clone all the code  
      
      # this step to use for install python 
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
    
  # they steps clone the code of current branch into  instide ubuntu latest container or like inside that ubuntu machine 
# it means clone the code on our runner which is ubuntu and if any chages perform inside this code automatically changer or like clone new code comes in runner 

      # this step install the linting tool
      - name: install linter # mainly identifiy the changes if perform then linter check and called actions and they clone the changes like that works 
        run: pip install ruff 

      - name: Run Lint Check
        run: ruff check .  # This step run the linter 
        # linter automatic check the syntex format and indentation of code 
      - name: Check Formatting
        run: ruff format --check .
